[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transcript-to-requirements"
version = "0.1.0"
description = "Turn a meeting transcript into structured requirements and Jira-ready stories, with per-field confidence, DFV/RICE scoring, three human approval gates, and an eval harness."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Christine Nguyen" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["requirements", "transcripts", "agents", "mcp", "human-in-the-loop", "evaluation"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8"]

[project.scripts]
t2r = "t2r.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
